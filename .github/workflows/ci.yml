name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx ludicord lint
      - run: npm run build
        env:
          LUDICORD_DEPLOYMENT_ENV: production
          LUDICORD_DISCORD_CLIENT_ID: "123456789012345678"
